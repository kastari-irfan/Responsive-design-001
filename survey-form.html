<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="survey-form.css">
</head>
<body>
    
    <h1 id="title">freeCodeCamp Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve the platform</p>
    <form action="https://survey-form.freecodecamp.rocks/" id="survey-form">
        <fieldset class="tag1">
            <label id="name-label" for="name">Nama<input id="name" type="text" required placeholder="Masukkan Nama"></label>
            <label id="email-label" for="email">Email<input id="email" type="email" required placeholder="Masukkan Email"></label>
            <label id="number-label"for="age">Age<input id="number" number type="number" min="9" max="25" placeholder="Masukkan Umur"></label>
            <label for="name">Which option best describes your cureent role?
                <select name="role" id="dropdown">
                    <option value="" disabled>Select current role</option>
                    <option value="student">Student</option>
                    <option value="full-time-job">Full Time Job</option>
                    <option value="full-time-learner">Full Time Learner</option>
                    <option value="prefer-not-to-say">Prefer not to say</option>
                    <option value="other">other</option>
                </select>
            </label>
        </fieldset>
        <fieldset>
            <p>Would you recommend freeCodeCamp to a friend ?</p>
            <label for="definitely"><input type="radio" name="Definitely" value="1">Definitely</label>
            <label for="Maybe"><input type="radio" name="radio" value="2">Maybe</label>
            <label for="Not Sure"><input type="radio" name="not-sure" value="3">Not sure</label>
        </fieldset>
        <fieldset>
            <p>What's Your Hobby</p>
            <label for="Reading"><input type="radio" name="Reading" value="1">Reading</label>
            <label for="coding"><input type="radio" name="coding" value="2">Coding</label>
            <label for="Writing"><input type="radio" name="Writing" value="3">Writing</label>
        </fieldset>
        <fieldset class="tag3">
            <p>What would you like to see improved? (Check all that apply)</p>
            <label for=""><input type="checkbox" value="Front-end">Front-end Projects</label>
            <label for=""><input type="checkbox" value="Back-end">Back-end Projects</label>
            <label for=""><input type="checkbox" value="Data">Data Visualization</label>
            <label for=""><input type="checkbox" value="Challenges">Challenges</label>
            <label for=""><input type="checkbox" value="open-source">Open Source Community</label>
            <label for=""><input type="checkbox" value="Gitter">Gitter help rooms</label>
            <label for=""><input type="checkbox" value="Videos">Videos</label>
            <label for=""><input type="checkbox" value="city">City Meetups</label>
        </fieldset>
        <fieldset>
            <p>Any comments or suggestions?</p>
            <label for="text-area"><textarea name="comment" id="comment" placeholder="Enter Your Comment Here" rows="5"></textarea></label>
            <input type="submit" name="submit" id="submit">
        </fieldset>
    </form>
</body>
</html>
